name: Generate Daily Article

on:
  schedule:
    # Запускаємо в нетипові хвилини, щоб уникнути перевантаження черги GitHub (Kyiv time: 09:23, 10:23, 17:23, 18:23)
    - cron: '23 6,7,14,15 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generate_article.py

      - name: Commit and push new article and manifest
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add articles/*.html articles/manifest.json
          # Commit only if there are changes to avoid exit code 1
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Add daily article $(date +'%Y-%m-%d')"
            git push origin main
          else
            echo "No changes to commit"
          fi

      - name: Auto-post to Facebook Page
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          python scripts/post_to_facebook.py || echo "Skipping Facebook posting due to error or missing token"

      - name: Auto-post to Telegram Channel (@Bellonix_ALM)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python scripts/post_to_telegram.py || echo "Skipping Telegram channel posting due to error or missing token"

      - name: Send Telegram notification (Success)
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE="✅ Daily article successfully generated and published for $(date +'%Y-%m-%d')!"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id=${TELEGRAM_CHAT_ID} -d text="$MESSAGE"

      - name: Send Telegram notification (Failure)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE="❌ Failed to generate daily article on $(date +'%Y-%m-%d'). Please check GitHub Actions logs."
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id=${TELEGRAM_CHAT_ID} -d text="$MESSAGE"
